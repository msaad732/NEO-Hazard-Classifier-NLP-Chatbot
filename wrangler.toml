name = "neo-hazard-classifier"
type = "javascript"
account_id = ""
workers_dev = true
main = "dist/worker.js"
compatibility_date = "2024-12-16"
compatibility_flags = ["nodejs_compat"]

[env.production]
routes = [
  { pattern = "api.neo-hazard.workers.dev/*", zone_name = "neo-hazard.workers.dev" }
]

[build]
command = "npm run build"
cwd = "./
watch_paths = ["src/**/*.ts", "server/**/*.ts", "shared/**/*.ts"]

[[r2.buckets]]
binding = "BUCKET"
bucket_name = "neo-hazard-data"

[[kv_namespaces]]
binding = "CACHE"
id = ""
preview_id = ""
